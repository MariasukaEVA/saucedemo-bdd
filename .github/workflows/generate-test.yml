name: Generate Test from Issue

on:
  issues:
    types: [labeled]

jobs:
  generate-test:
    name: Generate Test Suite
    runs-on: ubuntu-latest
    if: github.event.label.name == 'generate-test'

    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Extract issue body
        id: issue
        run: |
          echo "ISSUE_NUMBER=${{ github.event.issue.number }}" >> $GITHUB_ENV
          echo "ISSUE_TITLE=${{ github.event.issue.title }}" >> $GITHUB_ENV
          # Write issue body to file to avoid shell escaping issues
          cat > /tmp/issue-body.md << 'ISSUE_EOF'
          ${{ github.event.issue.body }}
          ISSUE_EOF

      - name: Generate test suite with Claude Code
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          BRANCH="generate-test/issue-${{ env.ISSUE_NUMBER }}"
          git checkout -b "$BRANCH"

          claude --print "
          Read the GitHub issue below and generate a complete test suite for the saucedemo-bdd project.

          Follow the instructions in prompts/generate/feature.md exactly.

          Issue #${{ env.ISSUE_NUMBER }}: ${{ env.ISSUE_TITLE }}

          $(cat /tmp/issue-body.md)

          After generating the files:
          1. Run: npx cucumber-js --config cucumber.config.js --dry-run
          2. If any steps are Undefined, fix them before finishing
          3. Run: npx tsc --noEmit
          4. Fix any TypeScript errors before finishing
          5. Report which files were created
          "

      - name: Verify generated tests
        run: |
          npx cucumber-js --config cucumber.config.js --dry-run
          npx tsc --noEmit

      - name: Commit and push generated files
        run: |
          BRANCH="generate-test/issue-${{ env.ISSUE_NUMBER }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/features/ src/steps/ src/pages/
          git commit -m "feat: generate test suite for issue #${{ env.ISSUE_NUMBER }}

          Auto-generated by Claude Code from GitHub issue #${{ env.ISSUE_NUMBER }}.
          Issue: ${{ env.ISSUE_TITLE }}"
          git push origin "$BRANCH"

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --title "feat: test suite for issue #${{ env.ISSUE_NUMBER }} — ${{ env.ISSUE_TITLE }}" \
            --body "## Auto-generated Test Suite

          Generated by Claude Code from issue #${{ env.ISSUE_NUMBER }}.

          ### What was generated
          - Feature file(s) in \`src/features/\`
          - Step definitions in \`src/steps/\`
          - Page object additions in \`src/pages/\`

          ### Verification
          - [x] \`npx cucumber-js --dry-run\` — all steps matched
          - [x] \`npx tsc --noEmit\` — no TypeScript errors

          ### Next steps
          1. Review the generated scenarios for correctness
          2. Run \`npm run test:uat -- --tags @smoke\` to verify against the live site
          3. Merge when satisfied

          Closes #${{ env.ISSUE_NUMBER }}" \
            --head "generate-test/issue-${{ env.ISSUE_NUMBER }}" \
            --base main

      - name: Comment on issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment ${{ env.ISSUE_NUMBER }} \
            --body "A test suite has been generated and a PR has been opened. Please review and merge when ready."
